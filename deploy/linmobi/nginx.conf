# Model gateway paths are kept separate from the panel's /api/v1 endpoints.
map $uri $sub2api_gateway_path {
    default 0;
    ~^/(v1|v1beta|antigravity|backend-api/codex)(/|$) 1;
    ~^/(api/v3|v3)/contents/generations/tasks(/|$) 1;
    ~^/(responses|models|images|videos|custom-voices)(/|$) 1;
    ~^/(chat/completions|messages/count_tokens|embeddings|alpha/search|tts|stt|realtime|web_search|x_search|contents/generations/tasks)(/|$) 1;
    /api/event_logging/batch 1;
}

map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.lin.mobi;
    default_type application/json;
    if ($sub2api_gateway_path) { return 404 '{"error":"not_found"}'; }
    return 308 https://ai.lin.mobi$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ai.lin.mobi;
    default_type application/json;
    if ($sub2api_gateway_path = 0) { return 404 '{"error":"not_found"}'; }
    return 308 https://api.ai.lin.mobi$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.ai.lin.mobi;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.lin.mobi;

    ssl_certificate /etc/letsencrypt/live/ai.lin.mobi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.lin.mobi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Sub2APITLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    default_type application/json;
    if ($sub2api_gateway_path) { return 404 '{"error":"not_found"}'; }

    client_max_body_size 100m;
    client_body_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sub2api_connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    location / {
        proxy_pass http://10.77.77.2:8080;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ai.lin.mobi;

    ssl_certificate /etc/letsencrypt/live/ai.lin.mobi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.lin.mobi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Sub2APITLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    default_type application/json;
    if ($sub2api_gateway_path = 0) { return 404 '{"error":"not_found"}'; }

    client_max_body_size 100m;
    client_body_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sub2api_connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    # Bare namespace paths must never fall back to the frontend.
    location ~ ^/(v1|v1beta|antigravity|backend-api/codex|images)/?$ {
        return 404 '{"error":"not_found"}';
    }

    # Some root aliases are missing from the embedded frontend's bypass list.
    # Normalize them to their existing /v1 routes before forwarding.
    location ~ ^/(chat/completions|messages/count_tokens|embeddings|alpha/search|tts|stt|realtime|web_search|x_search|custom-voices|videos|models|contents/generations/tasks)(/.*)?$ {
        rewrite ^ /v1$uri break;
        proxy_pass http://10.77.77.2:8080;
    }

    location ~ ^/v3/contents/generations/tasks(/.*)?$ {
        rewrite ^ /api$uri break;
        proxy_pass http://10.77.77.2:8080;
    }

    location / {
        proxy_pass http://10.77.77.2:8080;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.ai.lin.mobi;
    ssl_certificate /etc/letsencrypt/live/ai.lin.mobi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.lin.mobi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Sub2APITLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    return 444;
}
